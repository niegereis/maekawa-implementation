# Quantidade de participantes: a mesma carga do overlay normal, com 13 nos e 13 clientes.
# N = 13 = q^2 + q + 1 para q = 3 (plano projetivo de ordem 3), K = q + 1 = 4 votos por entrada.
# Compara com normal (N = 7, K = 3): espera e mensagens por entrada em funcao de N.
apiVersion: v1
kind: ConfigMap
metadata:
  name: experiment
  namespace: maekawa
data:
  CONTINUOUS: "false"            # rodada oficial: termina e o verify.py confere
  N_NODES: "13"
  VARIANT: "resolution"
  SYNC_ENABLED: "true"
  ACCESSES: "20"
  THINK_MIN_MS: "1000"
  THINK_MAX_MS: "5000"
