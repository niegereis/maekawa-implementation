# Observador de BEGIN/END. So registra; nao concede permissao e nao e um mutex.
apiVersion: v1
kind: Service
metadata:
  name: observer
  namespace: maekawa
spec:
  selector:
    app: observer
  ports:
    - name: instrumentation
      port: 7100
      targetPort: 7100
    # API do frontend: GET/POST /mode liga e desliga o Maekawa; GET /stats. Acesso de fora:
    # kubectl -n maekawa port-forward svc/observer 8080:8080
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: observer
  namespace: maekawa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: observer
  template:
    metadata:
      labels:
        app: observer
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: observer
          image: ghcr.io/OWNER/maekawa:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: ROLE
              value: observer
            - name: LISTEN_PORT
              value: "7100"
            - name: HTTP_PORT
              value: "8080"
          envFrom:
            - configMapRef:
                name: experiment
          ports:
            - containerPort: 7100
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 7100
            initialDelaySeconds: 2
            periodSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 192Mi
