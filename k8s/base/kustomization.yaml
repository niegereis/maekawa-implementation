apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: maekawa
resources:
  - namespace.yaml
  - configmap.yaml
  - sync-statefulset.yaml
  - observer.yaml
  - clients-job.yaml
images:
